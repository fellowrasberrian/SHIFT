 const o1=AC.createOscillator(),o2=AC.createOscillator(),f=AC.createBiquadFilter();AMB=AC.createGain();o1.type=o2.type='sawtooth';o1.frequency.value=55;o2.frequency.value=55.6;f.type='lowpass';f.frequency.value=170;AMB.gain.value=0.04;o1.connect(f);o2.connect(f);f.connect(AMB).connect(MG);o1.start();o2.start();

function mbox(f,t,v,dur){const o=AC.createOscillator(),o2=AC.createOscillator(),gn=AC.createGain(),g2=AC.createGain();o.type='sine';o2.type='triangle';o.frequency.value=f;o2.frequency.value=f*2.01;g2.gain.value=0.22;env(gn,t,0.004,v,dur);o.connect(gn);o2.connect(g2).connect(gn);gn.connect(MUS);o.start(t);o2.start(t);o.stop(t+dur+0.1);o2.stop(t+dur+0.1)}
function musicTick(){if(!AC||!MUS)return;if(nextNote<AC.currentTime)nextNote=AC.currentTime+0.05;
 while(nextNote<AC.currentTime+0.25){const i=musStep%48,bar=Math.floor(i/3),beat=i%3,h=CH[HAR[bar]];const fq=s=>440*Math.pow(2,s/12)*musWarp*(1+(Math.random()-0.5)*0.004*(2-musWarp));
  if(MEL[i]!=null)mbox(fq(MEL[i]+12),nextNote,0.06,1.3);
  if(beat===0)mbox(fq(h.b),nextNote,0.05,1.5);else h.c.forEach(c=>mbox(fq(c),nextNote,0.014,0.45));
  if(Math.random()<0.35)nz(nextNote+Math.random()*0.3,0.008,0.025,'highpass',3500);
  nextNote+=0.38/(musWarp*musWarp);musStep++}}

 musWarp+=(warp-musWarp)*Math.min(1,dt*1.2);MUS.gain.setTargetAtTime(vol*0.9*SET.music,AC.currentTime,0.25);musicTick();

 items.forEach((it,k)=>{let r=null;
  if(k===0&&suite&&cont(suite).length>=2)r=suite;
  else{let c=rooms.filter(x=>normal(x)&&x.i!==startI&&x.i!==lobbyI&&d[x.i]>=2&&!used.has(x.i)&&cont(x).length);if(!c.length)c=rooms.filter(x=>normal(x)&&x.i!==startI&&cont(x).length);if(!c.length)c=rooms.filter(x=>normal(x)&&cont(x).length);r=pick(c)}
  used.add(r.i);pick(cont(r)).loot=it;KEYLOC[it]=r});
 const anyN=()=>{const c=rooms.filter(r=>normal(r)&&cont(r).length);return c.length?pick(cont(pick(c))):null};
 if(suite){
  const sc=cont(suite);if(sc.length)pick(sc).loot='final';else{const f=anyN();if(f)f.loot='final'}
  let c=rooms.filter(r=>normal(r)&&r.i!==startI&&r.i!==lobbyI&&!used.has(r.i)&&cont(r).length);if(!c.length)c=rooms.filter(r=>normal(r)&&cont(r).length);
  const r=pick(c);pick(cont(r)).loot='skeleton';KEYLOC.skeleton=r;
 }else{const f=anyN();if(f)f.loot='final'}
 let mc=[startI,...adj(startI)].map(i=>rooms[i]).filter(r=>normal(r)&&cont(r).length);
 if(!mc.length)mc=rooms.filter(r=>normal(r)&&cont(r).length);
 pick(cont(pick(mc))).loot='mirror';
 const sb=cont(rooms[startI]);if(sb.length)pick(sb).loot='bandage';
 for(let k=0;k<5;k++){const f=anyN();if(f)f.loot='bandage'}
 {const f=anyN();if(f)f.loot='shard'}
 for(let k=0;k<2;k++){const f=anyN();if(f)f.loot='matches'}
 for(let k=0;k<5;k++){const f=anyN();if(f)f.loot='page'}
 {const DR=/DRESSER|NIGHTSTAND|SIDE TABLE|DESK|CUPBOARD|DRAWER|SIDEBOARD|CABINET/;const nShift=rooms.reduce((a,r)=>a+Object.values(r.slock).reduce((x,y)=>x+y,0),0)/2;
  for(let k=0;k<Math.max(3,nShift+2);k++){let c=rooms.filter(r=>normal(r)).flatMap(r=>cont(r).filter(f=>DR.test(f.search)));if(!c.length)c=rooms.filter(r=>normal(r)).flatMap(r=>cont(r));if(c.length)pick(c).loot='shift'}}
 const notes=shuffle(NOTES.slice());for(let k=0;k<4;k++){const f=anyN();if(f){f.loot='note';f.note=notes[k]}}
}
